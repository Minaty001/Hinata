name: Flutter Build APK

on:
  push:
    branches: [master]
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter test

      - name: Materialize release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/hinata-release.jks"
          ls -l "${{ github.workspace }}/hinata-release.jks"

      - name: Build release APK
        run: flutter build apk --release
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && github.workspace + '/hinata-release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hinata-android-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
