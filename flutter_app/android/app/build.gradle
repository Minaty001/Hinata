plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace = "com.hinata.ai"
    compileSdk = 35
    // Plugins (connectivity_plus, flutter_local_notifications, webview_flutter_android, ...)
    // require NDK 27.0.12077973; newer NDKs are backward compatible.
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // flutter_local_notifications requires core library desugaring
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.hinata.ai"
        minSdk = 28
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            // Signing credentials MUST be provided via environment variables.
            // Never hardcode passwords or commit keystore files.
            // Set these in your CI/CD pipeline or local shell before building:
            //   KEYSTORE_PATH    — absolute path to your .jks keystore file
            //   KEYSTORE_PASSWORD — keystore password
            //   KEY_ALIAS        — key alias inside the keystore
            //   KEY_PASSWORD     — key password
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: ""
            if (keystorePath) {
                storeFile file(keystorePath)
            }
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            // Only apply release signing if KEYSTORE_PATH is configured.
            // Falls back to debug signing locally to avoid build failures.
            def keystoreEnv = System.getenv("KEYSTORE_PATH")
            def hasKeystore = keystoreEnv != null && !keystoreEnv.isEmpty()
            signingConfig = hasKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
}
